# Banquise build settings (fm1-base tools/build.py)
name = "BANQUISE"
id_prefix = "FM-1_95"           # package identity: dev FM-1_9500 (check it is free before a public release)
usb_manufacturer = "OSR Records"
usb_product = "Banquise"
o2 = ["dsp/engine.c", "dsp/world.c"]   # the synth and the world's sounds, at -O2
include = ["dsp"]
vendored = ["fm1-base/"]        # fm1-base is a submodule inside the app: its own checks are its own
words = "words.tsv"
font_full = ["L"]
ble = false
tagline = "a musical walk on the ice, for the FM-1"
repo = "https://github.com/OSR-Experiment/FM1_IGLOO_OSR"
licence = "GPL-3.0-only"
credits = "Built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments)."
